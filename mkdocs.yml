site_name: My Docs Portfolio
site_url: https://cecilelng.github.io/my-docs-portfolio/
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - search.suggest
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences
nav:
  - Home: index.md
  - Tea guide: tea.md
  - Map Editor: 
      - Displaying sharp turnings: map-editor/radius.md
      - Measuring distances: map-editor/measure.md 
